name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build, pack and sign
        env:
          PTZ_SIGNING_KEY: ${{ secrets.PTZ_SIGNING_KEY }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^var Version = .*/var Version = \"$v\"/" main.go
          go run github.com/toolingdev/jadeck/sdk/addon/cmd/ptz-addon build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ptzaddon --generate-notes
